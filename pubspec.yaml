name: the_remote
description: The Remote — Streaming intelligence app. iOS-first.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.16.0
  shared_preferences: ^2.2.2

  # Models / serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # UI helpers
  cached_network_image: ^3.3.1
  fl_chart: ^0.66.0
  lottie: ^3.1.0
  url_launcher: ^6.2.5
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0

  # Geo (auto-detect región)
  geolocator: ^11.0.0

  # Image picker (avatar upload)
  image_picker: ^1.1.0
  path_provider: ^2.1.3

  # Backend — Supabase (auth + database)
  supabase_flutter: ^2.5.0

  # Native social sign-in
  sign_in_with_apple: ^6.1.0
  google_sign_in: ^6.2.1
  crypto: ^3.0.3

  # In-app purchases / subscriptions — RevenueCat
  purchases_flutter: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/avatars/
    - assets/mascots/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#000000"
